name: Daily news update

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache translations
        uses: actions/cache@v4
        with:
          path: translations.json
          key: translations-${{ github.run_id }}
          restore-keys: |
            translations-

      - name: Install dependencies
        run: pip install --quiet feedparser deep-translator Pillow

      - name: Build site
        run: python deploy.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html news.html
          if git diff --cached --quiet; then
            echo "No news changes today."
          else
            TODAY=$(TZ='Asia/Ulaanbaatar' date +'%Y-%m-%d')
            git commit -m "Daily news update ${TODAY}"
            git push
          fi
